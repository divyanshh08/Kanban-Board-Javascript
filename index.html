<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav>
        <div class="left">Kanban</div>
        <div class="right"><button id="toggle-modal" type="button">Add New Task</button></div>
      </nav>
      <section class="board">
        <div id="todo" class="tasks-col">
          <div class="heading">
            <div class="left">To Do</div>
            <div class="right">Count</div>
          </div>
          <!-- <div draggable="true" class="task">
            <h2>Task 1</h2>
            <p>Description for Task 1</p>
            <button class="del-btn">Delete</button>
            <button class="edit-btn">Edit</button>
          </div> -->
        </div>
        <div id="progress" class="tasks-col">
          <div class="heading">
            <div class="left">In Progress</div>
            <div class="right">Count</div>
          </div>
        </div>
        <div id="done" class="tasks-col">
          <div class="heading">
            <div class="left">Done</div>
            <div class="right">Count</div>
          </div>
        </div>
      </section>
    </main>
    <div class="modal add-new-task">
        <div class="bg"></div>
        <div class="center">
            <input id="task-title-input" type="text" placeholder="Task Title" />
            <textarea id="task-desc-input" placeholder="Task Description"></textarea>
            <button id="add-new-task" class="add-new-btn" type="button">Add Task</button>
        </div>
    </div>
    <div class="modal-edit">
      <div class="bg-edit"></div>
        <div class="center">
            <input id="edit-task-title-input" type="text" placeholder="Task Title" />
            <textarea id="edit-task-desc-input" placeholder="Task Description"></textarea>
            <button class="edit-task-btn" type="button">Edit</button>
        </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
